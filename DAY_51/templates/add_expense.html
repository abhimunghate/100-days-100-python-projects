{% extends "base.html" %}

{% block title %} Add Expense {% endblock %}
{% block content %}
<div class="form-container">
    <h1>Add Expense</h1>
    <form method="POST">
        <label>Date</label>
        <input type="date" name="date" required>

        <label>Category</label>
        <input type="text" name="category" placeholder="Food, Transport, Shopping..." required>

        <label>Amount</label>
        <input type="number" name="amount" step="0.01" min="0.01" placeholder="Enter amount" required>

        <label>Description</label>
        <textarea name="description" placeholder="Enter description" rows="4"></textarea>

        <button type="submit" class="button">Add Expense</button>
    </form>
</div>
{% endblock %}

<!-- Done -->
